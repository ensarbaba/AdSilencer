name: NotchTune

options:
  bundleIdPrefix: com.ensarbaba
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 6 from the first commit. Adopting it now, while the app is a stub,
    # keeps every later piece written clean; retrofitting it afterwards would be
    # one large diff across every file.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

targets:
  NotchTune:
    type: application
    platform: macOS
    sources:
      - path: NotchTune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ensarbaba.NotchTune
        PRODUCT_NAME: NotchTune
        INFOPLIST_FILE: NotchTune/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Personal-use build: ad-hoc signed, no hardened runtime, no sandbox.
        # The sandbox in particular must stay off: sandboxed processes receive
        # com.spotify.client.PlaybackStateChanged with a stripped userInfo.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  NotchTuneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchTuneTests
    dependencies:
      - target: NotchTune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ensarbaba.NotchTuneTests
        GENERATE_INFOPLIST_FILE: YES
