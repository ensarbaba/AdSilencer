name: AdSilencer

options:
  bundleIdPrefix: com.ensarbaba
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # No version here. The release job sets MARKETING_VERSION and
    # CURRENT_PROJECT_VERSION from the date.
    DEAD_CODE_STRIPPING: YES

targets:
  AdSilencer:
    type: application
    platform: macOS
    sources:
      - path: AdSilencer
    dependencies:
      - sdk: ScriptingBridge.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ensarbaba.AdSilencer
        PRODUCT_NAME: AdSilencer
        INFOPLIST_FILE: AdSilencer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: AdSilencer/AdSilencer.entitlements
        # Sandboxed processes cannot drive Spotify through Apple events.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Ad-hoc, so the test bundle and the app share a team and the
        # bundle can be loaded. Developer ID here breaks the test run.
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: NO
        # Signed and hardened for release, which notarizing requires.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 73DA6B7Z6K
          ENABLE_HARDENED_RUNTIME: YES
          # Notarizing rejects both of these: a signature with no trusted
          # timestamp, and the debugging entitlement Xcode injects by default.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  AdSilencerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AdSilencerTests
    dependencies:
      - target: AdSilencer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ensarbaba.AdSilencerTests
        GENERATE_INFOPLIST_FILE: YES
