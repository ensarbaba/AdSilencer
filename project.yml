name: AdSilencer

options:
  bundleIdPrefix: com.ensarbaba
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

targets:
  AdSilencer:
    type: application
    platform: macOS
    sources:
      - path: AdSilencer
    dependencies:
      - sdk: ScriptingBridge.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ensarbaba.AdSilencer
        PRODUCT_NAME: AdSilencer
        INFOPLIST_FILE: AdSilencer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Personal build. Ad-hoc signed.
        # Spotify is controlled through Apple events.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  AdSilencerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AdSilencerTests
    dependencies:
      - target: AdSilencer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ensarbaba.AdSilencerTests
        GENERATE_INFOPLIST_FILE: YES
